<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Centro de Control</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Control">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* Idea de layout: una columna para el pulgar; resumen arriba, listas debajo, barra de pestañas fija abajo. */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --ink:#131a2b; --muted:#647089; --line:#dde2ec;
  --accent:#2747e6; --accent-ink:#ffffff; --accent-soft:#e6ebff;
  --good:#17835a; --warn:#a86400; --bad:#c2332b;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --display: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d111e; --surface:#171f33; --ink:#eef1f8; --muted:#98a3ba; --line:#2a3550;
    --accent:#8497ff; --accent-ink:#0d111e; --accent-soft:#222c52;
    --good:#4cc38a; --warn:#f0b34a; --bad:#ff7a70; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d111e; --surface:#171f33; --ink:#eef1f8; --muted:#98a3ba; --line:#2a3550;
  --accent:#8497ff; --accent-ink:#0d111e; --accent-soft:#222c52;
  --good:#4cc38a; --warn:#f0b34a; --bad:#ff7a70; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 var(--font);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{padding:calc(env(safe-area-inset-top) + 14px) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
header h1{font:700 26px/1.1 var(--display);margin:0;text-wrap:balance}
header .sub{color:var(--muted);font-size:13px;margin-top:2px}
main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
nav{display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;background:none;border:0;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);border-radius:10px}
nav button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button[aria-current="page"]{color:var(--accent);font-weight:600}
h2{font:700 13px/1.2 var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:6px 0 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2 small{font-weight:600;letter-spacing:0;text-transform:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.pad{padding:14px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:52px}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600;overflow-wrap:anywhere}
.row .d{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.row.done .t{text-decoration:line-through;color:var(--muted);font-weight:400}
.tap{background:none;border:0;text-align:left;padding:0;flex:1;min-width:0}
.chk{width:28px;height:28px;flex:none;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.chk.on{background:var(--good);border-color:var(--good)}
.chk.on::after{content:"";width:11px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.pill{font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.warn{color:var(--warn);border-color:var(--warn)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.acc{color:var(--accent);border-color:var(--accent)}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:11px;padding:11px 16px;font-weight:600}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.line{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:9px}
.add{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:24px;line-height:1;flex:none}
.empty{color:var(--muted);padding:16px 14px;font-size:14px}
.level{display:flex;gap:14px;align-items:center}
.badge{width:64px;height:64px;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none;font:800 28px/1 var(--display);font-variant-numeric:tabular-nums}
.badge small{display:block;font:600 10px/1 var(--font);letter-spacing:.08em;margin-bottom:3px;opacity:.85}
.bar{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden;position:relative;margin:8px 0 4px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.good i{background:var(--good)} .bar.bad i{background:var(--bad)} .bar.warn i{background:var(--warn)}
.marks{position:relative;height:14px;font-size:10px;color:var(--muted)}
.marks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.notice{border-left:4px solid var(--bad)}
.notice.info{border-left-color:var(--accent)}
.dots{display:flex;gap:5px;margin-top:6px}
.dot{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:none;font-size:11px;color:var(--muted);padding:0}
.dot.on{background:var(--good);border-color:var(--good);color:#fff;font-weight:700}
.dot.hoy{border-color:var(--accent);border-width:2px}
.dot:disabled{opacity:.4}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.tile b{display:block;font:700 16px/1.2 var(--display);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile span{font-size:11px;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pos{color:var(--good)} .neg{color:var(--bad)}
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.monthnav b{font:700 17px var(--display);text-transform:capitalize}
.menu .row{font-weight:600}
.menu .row span.arrow{color:var(--muted)}
.back{background:none;border:0;color:var(--accent);font-weight:600;padding:4px 0;align-self:flex-start}
#sheet{position:fixed;inset:0;background:rgba(8,12,24,.5);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.open{display:flex}
#sheet form{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;gap:12px}
#sheet h3{margin:0;font:700 19px var(--display)}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:16px;color:var(--ink);width:100%;font-weight:400}
textarea{min-height:90px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .btn{flex:1}
#toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 84px);max-width:528px;margin:0 auto;background:var(--ink);color:var(--bg);padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;display:none;z-index:20}
#toast.open{display:block}
p{margin:0}
main>*{flex-shrink:0}
.reloj{font:800 64px/1.1 var(--display);font-variant-numeric:tabular-nums;margin:6px 0}
button:disabled{opacity:.4}
.lbl{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.lbl .dots{margin:0;flex-wrap:wrap}
.dot.big{width:42px;height:38px;font-size:12px}
.arrow{color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>
<div id="app">
  <header><div><h1 id="titulo">Hoy</h1><div class="sub" id="subt"></div></div><div id="hact"></div></header>
  <main id="main"></main>
  <nav id="nav" aria-label="Secciones"></nav>
</div>
<div id="sheet" role="dialog" aria-modal="true"><form id="form" novalidate></form></div>
<div id="toast" role="status"></div>
<script>
/*LOGIC*/
function p2(n){return String(n).padStart(2,'0')}
function ymd(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function parseF(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2])}
function addDays(s,n){var d=parseF(s);d.setDate(d.getDate()+n);return ymd(d)}
function lunes(s){var d=parseF(s);return addDays(s,-((d.getDay()+6)%7))}
function diaSem(s){return (parseF(s).getDay()+6)%7}
function tocaEntreno(t,dia){return t.creado<=dia&&(','+t.dias+',').indexOf(','+diaSem(dia)+',')>=0}
// Sortea un castigo de la lista y lo deja pendiente de cumplir.
function sancionar(st,motivo,rnd,fecha){if(!st.castigos.length)return null;
  var c=st.castigos[Math.floor(rnd()*st.castigos.length)].texto;
  st.sanciones.push({id:'s'+st.sanciones.length+'_'+fecha,motivo:motivo,castigo:c,fecha:fecha,cumplido:false});return c}
// Cuenta lo esperado y lo cumplido de una semana (hábitos por día, pendientes y entregas con fecha en la semana).
function rutinaHecha(r,dia){var l=r.log[dia];if(!l)return false;var n=0;for(var k in l)n++;
  return n>=String(r.pasos).split('\n').filter(function(x){return x.trim()}).length}
function statsSemana(st,ini,hasta){
  var fin=addDays(ini,6);if(hasta<fin)fin=hasta;
  var c={habitos:[0,0],rutinas:[0,0],entrenos:[0,0],pendientes:[0,0],tareas:[0,0],metas:[0,0],entregas:[0,0]};
  function add(k,ok){c[k][1]++;if(ok)c[k][0]++}
  function enSem(f){return f&&f>=ini&&f<=fin}
  for(var i=0;i<7;i++){var dia=addDays(ini,i);if(dia>fin)break;
    st.habitos.forEach(function(h){if(h.creado<=dia)add('habitos',h.log[dia])});
    (st.rutinas||[]).forEach(function(r){if(r.creado<=dia)add('rutinas',rutinaHecha(r,dia))});
    (st.entrenos||[]).forEach(function(t){if(tocaEntreno(t,dia))add('entrenos',t.log[dia])})}
  st.pendientes.forEach(function(p){if(enSem(p.fecha))add('pendientes',p.hecho)});
  (st.tareas||[]).forEach(function(p){if(enSem(p.fecha))add('tareas',p.hecho)});
  (st.metas||[]).forEach(function(p){if(enSem(p.fecha))add('metas',p.hecho)});
  st.entregas.forEach(function(e){if(e.estado!=='cancelada'&&enSem(e.fecha))add('entregas',e.estado==='entregada')});
  var done=0,exp=0;for(var k in c){done+=c[k][0];exp+=c[k][1]}
  return {done:done,exp:exp,pct:exp?Math.round(done/exp*100):null,cat:c};
}
// Cierra cada semana terminada: 80% o más sube un nivel; menos de 50% baja uno y sortea un castigo.
function evaluar(st,hoy,rnd){
  var lim=lunes(hoy),nuevas=[];
  while(addDays(st.evaluadoHasta,7)<=lim){
    var ini=st.evaluadoHasta,s=statsSemana(st,ini,addDays(ini,6)),delta=0,castigo=null;
    if(s.pct!==null){if(s.pct>=80)delta=1;else if(s.pct<50){delta=-1;
      castigo=sancionar(st,'Bajaste de nivel: semana al '+s.pct+'%',rnd,ini)}}
    st.nivel=Math.max(1,st.nivel+delta);
    var reg={ini:ini,done:s.done,exp:s.exp,pct:s.pct,delta:delta,castigo:castigo,cumplido:false,mig:1,nivel:st.nivel};
    st.semanas.unshift(reg);nuevas.push(reg);st.evaluadoHasta=addDays(ini,7);
  }
  return nuevas;
}
// Revisa los días ya terminados: entrenamiento que tocaba y no se hizo, meta que venció sin cumplirse o toma de medicamento sin marcar dan castigo.
function cerrarDias(st,hoy,rnd){var d=st.diaRevisado,min=addDays(hoy,-14),n=[];if(d<min)d=min;
  while(d<hoy){
    st.entrenos.forEach(function(t){if(tocaEntreno(t,d)&&!t.log[d]){if(sancionar(st,'No entrenaste: '+t.nombre,rnd,d))n.push(t.nombre)}});
    st.metas.forEach(function(m){if(m.fecha===d&&!m.hecho&&!m.fallada){m.fallada=true;if(sancionar(st,'Meta sin cumplir: '+m.titulo,rnd,d))n.push(m.titulo)}});
    (st.meds||[]).forEach(function(m){var l=m.log[d]||{};if(m.creado<d&&[m.h1,m.h2,m.h3].some(function(h){return h&&!l[h]})){if(sancionar(st,'No tomaste: '+m.nombre,rnd,d))n.push(m.nombre)}});
    d=addDays(d,1)}
  st.diaRevisado=hoy;return n}
function racha(h,hoy){var d=h.log[hoy]?hoy:addDays(hoy,-1),n=0;while(h.log[d]){n++;d=addDays(d,-1)}return n}
/*END*/

var KEY='centro_control_v1',HOY=ymd(new Date()),inFrame=false;
try{inFrame=window.self!==window.top}catch(e){inFrame=true}
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)};
function nuevo(){
  var m=addDays(HOY,1);
  return {v:1,nivel:1,evaluadoHasta:lunes(HOY),semanas:[],avisados:{},ejemplos:true,
    clientes:[],inventario:[],metas:[],entrenos:[],tareas:[],sanciones:[],metaVentas:0,diaRevisado:HOY,
    rutinas:[],proyectos:[],libros:[],meds:[],notas:[],regalo:[],focos:[],foco:null,
    mensajes:[{id:uid(),ej:1,titulo:'Ejemplo: pedido listo',texto:'¡Hola! Tu pedido ya está listo. ¿Te queda bien que te lo entregue hoy?'}],
    entregas:[{id:uid(),ej:1,cliente:'Cliente de ejemplo',articulo:'Sudadera negra talla M',lugar:'Metro Cuauhtémoc',fecha:HOY,hora:'18:00',monto:450,estado:'pendiente'},
              {id:uid(),ej:1,cliente:'Otro ejemplo',articulo:'Tenis blancos 27',lugar:'Plaza Fiesta San Agustín',fecha:m,hora:'12:30',monto:900,estado:'pendiente'}],
    pendientes:[{id:uid(),ej:1,texto:'Ejemplo: subir fotos nuevas a Marketplace',fecha:HOY,hecho:false},
                {id:uid(),ej:1,texto:'Ejemplo: comprar bolsas para envíos',fecha:'',hecho:false}],
    eventos:[{id:uid(),ej:1,titulo:'Ejemplo: cita con proveedor',fecha:m,hora:'16:00',nota:''}],
    habitos:[{id:uid(),ej:1,nombre:'Ejemplo: leer 20 minutos',creado:HOY,log:{}}],
    movs:[{id:uid(),ej:1,tipo:'gasto',monto:120,concepto:'Ejemplo: paquetería',fecha:HOY}],
    castigos:[{id:uid(),texto:'50 burpees'},{id:uid(),texto:'24 horas sin redes sociales'},{id:uid(),texto:'Ducha fría'},{id:uid(),texto:'Sin videojuegos el fin de semana'}]};
}
var S,mem=null;
function cargar(){var raw=null;try{raw=localStorage.getItem(KEY)}catch(e){raw=mem}
  try{S=raw?JSON.parse(raw):nuevo()}catch(e){S=nuevo()}
  ['entregas','pendientes','eventos','habitos','movs','castigos','semanas','clientes','inventario','metas','entrenos','tareas','mensajes','sanciones','rutinas','proyectos','libros','meds','notas','regalo','focos'].forEach(function(k){if(!Array.isArray(S[k]))S[k]=[]});
  if(!S.diaRevisado)S.diaRevisado=HOY;
  S.meds.forEach(function(m){if(!m.creado)m.creado=HOY});
  Object.keys(S.avisados).forEach(function(k){if(k.indexOf(HOY)<0)delete S.avisados[k]});
  S.semanas.forEach(function(w){if(w.castigo&&!w.cumplido&&!w.mig)S.sanciones.push({id:'w'+w.ini,motivo:'Bajaste de nivel: semana al '+w.pct+'%',castigo:w.castigo,fecha:w.ini,cumplido:false});w.mig=1});
  if(!S.avisados)S.avisados={};if(!S.nivel)S.nivel=1;if(!S.evaluadoHasta)S.evaluadoHasta=lunes(HOY)}
function guardar(){var raw=JSON.stringify(S);mem=raw;try{localStorage.setItem(KEY,raw)}catch(e){}}

var ui={tab:'hoy',sub:null,mes:HOY.slice(0,7),verHechos:false};
var $=function(id){return document.getElementById(id)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return (Number(n)||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:2})}
var DIAS=['dom','lun','mar','mié','jue','vie','sáb'],MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'],MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function fFecha(s){if(!s)return '';if(s===HOY)return 'Hoy';if(s===addDays(HOY,1))return 'Mañana';if(s===addDays(HOY,-1))return 'Ayer';var d=parseF(s);return DIAS[d.getDay()]+' '+d.getDate()+' '+MESES[d.getMonth()]}
function fHora(h){if(!h)return '';var a=h.split(':'),n=+a[0];return ((n+11)%12+1)+':'+a[1]+(n<12?' a.m.':' p.m.')}
function porFecha(a,b){return (a.fecha+(a.hora||'99')).localeCompare(b.fecha+(b.hora||'99'))}
function toast(t){var el=$('toast');el.textContent=t;el.classList.add('open');clearTimeout(toast.t);toast.t=setTimeout(function(){el.classList.remove('open')},3500)}

/* ---------- Formularios ---------- */
var formCb=null;
function abrir(titulo,campos,vals,onSave,onDelete){
  vals=vals||{};formCb={campos:campos,onSave:onSave,onDelete:onDelete,armado:false};
  var h='<h3>'+esc(titulo)+'</h3>';
  campos.forEach(function(c){var v=vals[c.k]==null?'':vals[c.k],id='f_'+c.k;
    if(c.type==='dias'){var set=','+v+',';h+='<div class="lbl">'+esc(c.label)+'<div class="dots">'+DL.map(function(n,i){return '<button type="button" class="dot big'+(set.indexOf(','+i+',')>=0?' on':'')+'" data-a="togDiaF" data-i="'+i+'">'+n+'</button>'}).join('')+'</div></div>';return}
    h+='<label for="'+id+'">'+esc(c.label);
    if(c.type==='select')h+='<select id="'+id+'">'+c.opts.map(function(o){return '<option value="'+esc(o[0])+'"'+(o[0]===v?' selected':'')+'>'+esc(o[1])+'</option>'}).join('')+'</select>';
    else if(c.type==='textarea')h+='<textarea id="'+id+'">'+esc(v)+'</textarea>';
    else h+='<input id="'+id+'" type="'+(c.type||'text')+'" value="'+esc(v)+'"'+(c.type==='number'?' inputmode="decimal" step="any" min="0"':'')+(c.ph?' placeholder="'+esc(c.ph)+'"':'')+(c.list?' list="dl_'+c.k+'" autocomplete="off"':'')+'>'+(c.list?'<datalist id="dl_'+c.k+'">'+c.list.map(function(o){return '<option value="'+esc(o)+'">'}).join('')+'</datalist>':'');
    h+='</label>'});
  h+='<p class="small" id="ferr" style="color:var(--bad)"></p><div class="actions"><button type="button" class="btn line" data-a="cerrar">Cancelar</button><button type="submit" class="btn">Guardar</button></div>';
  if(onDelete)h+='<button type="button" class="btn danger" data-a="borrarForm">Borrar</button>';
  $('form').innerHTML=h;$('sheet').classList.add('open');
}
function cerrar(){$('sheet').classList.remove('open');formCb=null}
$('form').addEventListener('submit',function(ev){ev.preventDefault();if(!formCb)return;var v={},falta=null;
  formCb.campos.forEach(function(c){var x=c.type==='dias'?[].map.call($('form').querySelectorAll('.dot.on'),function(b){return b.dataset.i}).join(','):$('f_'+c.k).value.trim();if(c.type==='number')x=x===''?0:Math.abs(parseFloat(x))||0;v[c.k]=x;if(c.req&&!x&&!falta)falta=c.label});
  if(falta){$('ferr').textContent='Falta llenar: '+falta;return}

  togDia:function(d){var h=S.habitos.find(function(x){return x.id===d.id});if(h.log[d.dia])delete h.log[d.dia];else h.log[d.dia]=1},

  pagar:function(d){var e=S.entregas.find(function(x){return x.id===d.id});e.pago='si';e.pagadoEn=HOY;sincIngreso(e);toast('Cobrado. Se anotó '+money(e.monto)+' en Finanzas.')},
  nuevoCliente:function(){fCliente()},edCliente:function(d){fCliente(d.id)},verCliente:function(d){ui.sub='cliente';ui.cid=d.id},

  nuevoProd:function(){fProducto()},edProd:function(d){fProducto(d.id)},
  nuevaMeta:function(){fMeta()},edMeta:function(d){fMeta(d.id)},togMeta:function(d){var m=S.metas.find(function(x){return x.id===d.id});m.hecho=!m.hecho},
  nuevoEntreno:function(){fEntreno()},edEntreno:function(d){fEntreno(d.id)},togEntreno:function(d){var t=S.entrenos.find(function(x){return x.id===d.id});if(t.log[HOY])delete t.log[HOY];else t.log[HOY]=1},
  nuevaTarea:function(){fTarea()},edTarea:function(d){fTarea(d.id)},togTarea:function(d){var t=S.tareas.find(function(x){return x.id===d.id});t.hecho=!t.hecho},
  limpiarTareas:function(){S.tareas=S.tareas.filter(function(t){return !t.hecho})},
  nuevoMsg:function(){fMensaje()},edMsg:function(d){fMensaje(d.id)},
  copiarMsg:function(d){var m=S.mensajes.find(function(x){return x.id===d.id});try{navigator.clipboard.writeText(m.texto).then(function(){toast('Mensaje copiado.')},function(){toast('No se pudo copiar. Abre el mensaje y cópialo a mano.')})}catch(e){toast('No se pudo copiar. Abre el mensaje y cópialo a mano.')}return false},
  metaVentas:function(){fMetaVentas()},

  togDosis:function(d){var m=S.meds.find(function(y){return y.id===d.id}),l=m.log[HOY]||(m.log[HOY]={});if(l[d.h])delete l[d.h];else l[d.h]=1},

};
document.addEventListener('click',function(ev){var el=ev.target.closest('[data-a]');if(!el)return;var f=ACC[el.dataset.a];if(!f)return;
  var abierto=!!formCb,r=f(el.dataset,el);if(r===false)return;if(abierto&&formCb)return;guardar();if(!formCb)render()});
$('sheet').addEventListener('click',function(ev){if(ev.target===$('sheet'))cerrar()});
// Al elegir un producto del inventario se llenan solos el artículo y el precio.
$('form').addEventListener('change',function(ev){if(ev.target.id!=='f_prodId')return;var p=S.inventario.find(function(x){return x.id===ev.target.value});if(!p)return;
  if(!$('f_articulo').value)$('f_articulo').value=prodNombre(p);if(!+$('f_monto').value&&+p.precio)$('f_monto').value=p.precio});

/* ---------- Avisos con la app abierta ---------- */
function revisarAvisos(){var ahora=new Date(),cambio=false;
  var lista=S.entregas.filter(function(e){return e.estado==='pendiente'}).map(function(e){return {id:e.id,fecha:e.fecha,hora:e.hora,t:'Entrega: '+e.cliente+' · '+e.articulo}})
    .concat(S.eventos.map(function(e){return {id:e.id,fecha:e.fecha,hora:e.hora,t:e.titulo}}));
  S.meds.forEach(function(m){var l=m.log[HOY]||{};horasMed(m).forEach(function(hr){if(!l[hr])lista.push({id:m.id,fecha:HOY,hora:hr,t:'Hora de tomar '+m.nombre+(m.dosis?' ('+m.dosis+')':''),pre:0})})});
  lista.forEach(function(x){if(!x.hora||x.fecha!==HOY||S.avisados[x.id+x.fecha+x.hora])return;
    var a=x.hora.split(':'),t=parseF(x.fecha);t.setHours(+a[0],+a[1]);var min=(t-ahora)/60000;
    if(min<=(x.pre===0?0:30)&&min>(x.pre===0?-20:-5)){S.avisados[x.id+x.fecha+x.hora]=1;cambio=true;var msg=x.pre===0?x.t:x.t+' a las '+fHora(x.hora);toast(msg);
      try{if(!inFrame&&'Notification' in window&&Notification.permission==='granted'&&navigator.serviceWorker)navigator.serviceWorker.ready.then(function(r){r.showNotification('Centro de Control',{body:msg})}).catch(function(){})}catch(e){}}});
  if(cambio)guardar()}

/* ---------- Arranque ---------- */
cargar();
var falt=cerrarDias(S,HOY,Math.random),cerradas=evaluar(S,HOY,Math.random);guardar();render();
if(falt.length)toast('Castigo nuevo por: '+falt.join(', '));
if(cerradas.length){var u=cerradas[0];toast(u.delta>0?'Semana cerrada: subiste al nivel '+u.nivel+'.':u.delta<0?'Semana cerrada: bajaste de nivel. Revisa tu castigo.':'Semana cerrada: te mantienes en el nivel '+u.nivel+'.')}
if(S.foco)terminarFoco(false,'la app se cerró durante la sesión.');
setInterval(tickFoco,1000);
revisarAvisos();setInterval(function(){var h=ymd(new Date());if(h!==HOY){HOY=h;cerrarDias(S,HOY,Math.random);evaluar(S,HOY,Math.random);guardar();render()}revisarAvisos()},60000);
try{if(!inFrame&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(function(){})}catch(e){}
</script>
